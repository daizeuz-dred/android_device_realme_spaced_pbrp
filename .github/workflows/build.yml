name: PBRP Build
on:
  workflow_dispatch:
    inputs:
      DEPLOY_TYPE:
        description: 'Deploy Type (TEST/BETA/OFFICIAL)'
        required: true
        default: 'TEST'
      ChangeLogs:
        description: 'Build ChangeLogs'
        required: true
        default: 'Sync Latest Source'

env:
  BUILD_RELEASE_TYPE: ${{ github.event.inputs.DEPLOY_TYPE }}
  CHANGELOG: ${{ github.event.inputs.ChangeLogs }}
  DEVICE_CODENAME: "spaced"
  DEVICE_PATH: "device/realme/spaced"

jobs:
  PBRP_CI:
    runs-on: ubuntu-latest
    steps:
      # 1. THE SPACE FIX: Must run FIRST to ensure apt-get update has room to breathe
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 100
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean System and Install Dependencies
        run: |
          # 1. Remove massive pre-installed folders that maximize-build-space might miss
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/lib/jvm
          
          # 2. Clean apt cache and existing lists to free up /var
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          
          # 3. Now run update with limited overhead
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 sshpass
          
          # 4. Repo Tool setup
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          
      - name: Sync PBRP Source
        run: |
          mkdir -p pbrp
          cd pbrp
          git config --global user.email "bot@pbrp.co"
          git config --global user.name "PBRP Bot"
          
          # Initialize with smallest possible footprint
          ~/bin/repo init -u https://github.com/PitchBlackRecoveryProject/manifest_pb -b android-12.1 --depth=1
          
          # Sync only what is absolutely necessary
          ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-tags --no-clone-bundle --optimized-fetch --prune

      - name: Clone Device Tree
        run: |
          cd pbrp
          git clone https://github.com/${{ github.repository }} -b android-12.1 ${{ env.DEVICE_PATH }}

      - name: Build Recovery
        run: |
          cd pbrp
          source build/envsetup.sh
          
          # Lunch first
          lunch omni_${{ env.DEVICE_CODENAME }}-eng
          
          # Deleting .repo frees up ~15-20GB immediately after sync
          rm -rf .repo
          
          mka recoveryimage

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-${{ env.DEVICE_CODENAME }}
          path: |
            pbrp/out/target/product/${{ env.DEVICE_CODENAME }}/PitchBlack*.zip
            pbrp/out/target/product/${{ env.DEVICE_CODENAME }}/recovery.img
